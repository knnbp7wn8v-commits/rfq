worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name your_domain.com;  # Cseréld le a saját domain nevedre
        return 301 https://$host$request_uri;  # Átirányítás HTTPS-re
    }

    server {
        listen 443 ssl;  # 443-as port
        server_name your_domain.com;  # Cseréld le a saját domain nevedre

        ssl_certificate /etc/pki/tls/certs/cert.pem;  # SSL tanúsítvány elérési útja
        ssl_certificate_key /etc/pki/tls/certs/key.pem;  # Privát kulcs elérési útja

        access_log /var/log/nginx/access.log main;

        # Az alkalmazás proxizása a Node.js szerverre
        location / {
            proxy_pass https://localhost:8443;  # Node.js alkalmazás portja
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
